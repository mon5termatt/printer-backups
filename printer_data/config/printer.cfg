# MAIN Configuration File

# Included Configurations

### TOOLHEAD 
[include configs/shaper.cfg]
[include configs/carto.cfg]
[include configs/OrbiterSensor.cfg]
### MACROS
[include macros.cfg]
### STEPPERS
[include configs/steppers.cfg]
### FANS
[include configs/fans.cfg]
### BED
[include configs/bed.cfg]
### LIGHTING
[include configs/led_effects.cfg]
### CALIBRATIONS
[include calibration/TEST_SPEED.cfg]
[include calibration/shaketune.cfg]
[include configs/KAMP_Settings.cfg]
### OTHER MODULES
[include moonraker_obico_macros.cfg]
[include shell_command.cfg]
[include mainsail.cfg]
[include timelapse.cfg]

[exclude_object]


# Printer Settings
[printer]
kinematics: corexy
max_velocity: 600
max_accel: 60000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5
max_z_velocity: 20
max_z_accel: 500

# Microcontroller Configuration

[mcu]
#mcu SKR 3 EZ
canbus_uuid: 91b8570fbaba

#[mcu pi]
#serial: /tmp/klipper_host_mcu

# [mcu EBBCan]
# canbus_uuid: 80e0a08050fc


# G-code Settings
[gcode_arcs]
resolution: 0.1

# Response Settings
[respond]
default_type: command


# Temperature Sensors Configuration
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor EBBCan]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 100


# Extruder Configuration
[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.025             #to be calibrated
pressure_advance_smooth_time: 0.03  #to be calibrated
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
min_temp: 0
max_temp: 310

[tmc2209 extruder]
uart_pin: EBBCan: PA15
interpolate: true
run_current: 0.85 
sense_resistor: 0.11 
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4


[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 1800

